<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bulk Typography Style Editor</title>
<style>
/* STYLE_INJECT */
</style>
</head>
<body>

<div id="toolbar">
  <button id="reloadBtn">&#8635; Reload</button>
  <div id="filterWrap">
    <input id="filterName" type="text" placeholder="Filter by name…" list="nameGroupList" autocomplete="off"/>
    <button id="clearFilterBtn" title="Clear filter">&#x2715;</button>
  </div>
  <span id="selInfo">Loading…</span>
  <div class="toolbar-spacer"></div>
  <button id="clearBtn" disabled>Clear edits</button>
  <button id="applyBtn" disabled>Apply changes</button>
</div>

<datalist id="nameGroupList"></datalist>

<div id="bulkBar">
  <strong class="bulk-title">Bulk edit selected:</strong>

  <div class="bb-group"><label>Family</label><input id="bb-family" class="bulk-family-input" type="text" placeholder="Family…"/></div>
  <div class="bb-group"><label>Style</label><select id="bb-style"><option value="">—</option></select></div>
  <div class="bb-sep"></div>

  <div class="bb-group">
    <label>Size</label>
    <input id="bb-size" type="number" min="1" step="0.5" placeholder="—"/>
    <button class="bb-var-btn" data-bulk-field="fontSize" title="Bind variable to font size">⚡</button>
    <div id="bb-var-fontSize" class="bb-var-chip is-hidden"><span></span><button data-clear-bulk="fontSize">✕</button></div>
  </div>
  <div class="bb-sep"></div>

  <div class="bb-group">
    <label>LH</label>
    <select id="bb-lhUnit"><option value="">—</option><option>AUTO</option><option>PIXELS</option><option>PERCENT</option></select>
    <input id="bb-lhVal" type="number" min="0" step="0.5" placeholder="val"/>
    <button class="bb-var-btn" data-bulk-field="lineHeight" title="Bind variable to line height">⚡</button>
    <div id="bb-var-lineHeight" class="bb-var-chip is-hidden"><span></span><button data-clear-bulk="lineHeight">✕</button></div>
  </div>
  <div class="bb-sep"></div>

  <div class="bb-group">
    <label>LS</label>
    <select id="bb-lsUnit"><option value="">—</option><option>PIXELS</option><option>PERCENT</option></select>
    <input id="bb-lsVal" type="number" step="0.1" placeholder="val"/>
    <button class="bb-var-btn" data-bulk-field="letterSpacing" title="Bind variable to letter spacing">⚡</button>
    <div id="bb-var-letterSpacing" class="bb-var-chip is-hidden"><span></span><button data-clear-bulk="letterSpacing">✕</button></div>
  </div>
  <div class="bb-sep"></div>

  <div class="bb-group"><label>Case</label>
    <select id="bb-case">
      <option value="">—</option><option>ORIGINAL</option><option>UPPER</option><option>LOWER</option>
      <option>TITLE</option><option>SMALL_CAPS</option><option>SMALL_CAPS_FORCED</option>
    </select>
  </div>
  <div class="bb-group"><label>Decor</label>
    <select id="bb-deco"><option value="">—</option><option>NONE</option><option>UNDERLINE</option><option>STRIKETHROUGH</option></select>
  </div>
  <div class="bb-group"><label>Lead Trim</label>
    <select id="bb-lt"><option value="">—</option><option>NONE</option><option>CAP_HEIGHT</option></select>
  </div>
  <div class="bb-sep"></div>

  <div class="bb-group">
    <label>Para Sp</label>
    <input id="bb-paraSp" type="number" min="0" step="0.5" placeholder="—"/>
    <button class="bb-var-btn" data-bulk-field="paragraphSpacing" title="Bind variable to paragraph spacing">⚡</button>
    <div id="bb-var-paragraphSpacing" class="bb-var-chip is-hidden"><span></span><button data-clear-bulk="paragraphSpacing">✕</button></div>
  </div>

  <div class="bb-group">
    <label>Indent</label>
    <input id="bb-indent" type="number" min="0" step="0.5" placeholder="—"/>
    <button class="bb-var-btn" data-bulk-field="paragraphIndent" title="Bind variable to paragraph indent">⚡</button>
    <div id="bb-var-paragraphIndent" class="bb-var-chip is-hidden"><span></span><button data-clear-bulk="paragraphIndent">✕</button></div>
  </div>

  <div class="bb-group">
    <label>List Sp</label>
    <input id="bb-listSp" type="number" min="0" step="0.5" placeholder="—"/>
  </div>
  <div class="bb-group"><label>Hang List</label>
    <select id="bb-hangList"><option value="">—</option><option value="true">On</option><option value="false">Off</option></select>
  </div>
  <div class="bb-group"><label>Hang Punct</label>
    <select id="bb-hangPunct"><option value="">—</option><option value="true">On</option><option value="false">Off</option></select>
  </div>

  <button id="applyBulkBtn">Apply to selected</button>
</div>

<div id="errorPanel"></div>

<div id="tableWrap">
  <table id="styleTable">
    <colgroup id="colgroup"></colgroup>
    <thead><tr id="headerRow"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div id="varPicker">
  <div id="varPickerLabel"></div>
  <input id="varPickerSearch" type="text" placeholder="Search variables…"/>
  <div id="varPickerList"></div>
  <div id="varPickerClear">&#x2715; Unbind variable</div>
</div>

<script>
<!-- SCRIPT_INJECT -->
</script>
</body>
</html>
