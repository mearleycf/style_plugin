  function updateSelectAll() {
    const all = document.querySelectorAll("tbody tr input.row-check").length;
    const checked = document.querySelectorAll("tbody tr input.row-check:checked").length;
    const sa = document.getElementById("selectAll");
    if (!sa) return;
    sa.indeterminate = checked > 0 && checked < all;
    sa.checked = all > 0 && checked === all;
  }
  function updateToolbar() {
    const dirtyCount = styles.filter((s) => isDirty(s.id)).length;
    const sel = selectedIds();
    const filtered = getFilteredStyles();
    document.getElementById("applyBtn").disabled = dirtyCount === 0;
    document.getElementById("clearBtn").disabled = dirtyCount === 0;
    document.getElementById("selInfo").textContent = sel.length ? sel.length + " selected" : nameFilter ? filtered.length + " / " + styles.length + " styles" : styles.length + " styles";
    updateSelectAll();
  }
  function renderTable() {
    const tbody = document.getElementById("tableBody");
    clearElement(tbody);
    getFilteredStyles().forEach((viewModel) => tbody.appendChild(buildRow(viewModel)));
    updateToolbar();
    requestResize();
  }
  function refreshRow(id) {
    const viewModel = styles.find((s) => s.id === id);
    if (!viewModel) return;
    const existing = document.querySelector('tr[data-id="' + CSS.escape(id) + '"]');
    if (!existing) return;
    const wasChecked = existing.querySelector("input.row-check") && existing.querySelector("input.row-check").checked;
    const newRow = buildRow(viewModel);
    existing.replaceWith(newRow);
    if (wasChecked) {
      const cb = newRow.querySelector("input.row-check");
      if (cb) cb.checked = true;
    }
    updateToolbar();
  }
  document.getElementById("applyBtn").addEventListener("click", sendApply);
  document.getElementById("clearBtn").addEventListener("click", () => {
    edits.clear();
    applyStatus.clear();
    hideErrorPanel();
    renderTable();
  });
  document.getElementById("reloadBtn").addEventListener("click", () => {
    requestCanonicalReload();
  });
  function sendApply() {
    const pending = styles.filter((s) => isDirty(s.id));
    if (!pending.length) return;
    const editList = pending.map((s) => {
      const e = edits.get(s.id);
      return { id: s.id, changes: e.changes, varBindings: e.varBindings };
    });
    parent.postMessage({ pluginMessage: { type: "apply-changes", edits: editList } }, "*");
    document.getElementById("applyBtn").disabled = true;
  }
  window.onmessage = (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "styles-loaded") {
      try {
        const payload = validateStylesLoadedMessage(msg);
        styles = payload.styles;
        fontMap = payload.fonts;
        variableList = payload.variables;
        variableMap.clear();
        variableList.forEach((v) => variableMap.set(v.id, v));
        if (restoreAfterCanonicalReload) {
          edits = restoreAfterCanonicalReload.edits;
          applyStatus = restoreAfterCanonicalReload.applyStatus;
          restoreAfterCanonicalReload = null;
        } else {
          edits.clear();
          applyStatus.clear();
          hideErrorPanel();
        }
        refreshNameGroupList();
        renderTable();
      } catch (err) {
        renderErrorPanel("Invalid styles-loaded message:", [err instanceof Error ? err.message : String(err)]);
      }
      return;
    }
    if (msg.type === "apply-results") {
      let results;
      try {
        results = validateApplyResultsMessage(msg);
      } catch (err) {
        renderErrorPanel("Invalid apply-results message:", [err instanceof Error ? err.message : String(err)]);
        return;
      }
      const failed = [];
      let hasSuccessfulApply = false;
      results.forEach((r) => {
        applyStatus.set(r.id, { ok: r.ok, error: r.error });
        if (r.ok) {
          hasSuccessfulApply = true;
          edits.delete(r.id);
        } else {
          failed.push(r);
        }
      });
      if (failed.length) {
        renderErrorPanel("Errors (" + failed.length + "):", failed.map((r) => r.name + ": " + (r.error || "unknown")));
      } else {
        hideErrorPanel();
      }
      renderTable();
      if (hasSuccessfulApply) {
        restoreAfterCanonicalReload = failed.length ? { edits: new Map(edits), applyStatus: new Map(applyStatus) } : null;
        requestCanonicalReload();
      }
      return;
    }
    if (msg.type === "error") {
      renderErrorPanel("Error:", [typeof msg.message === "string" ? msg.message : "Unknown error"]);
    }
  };
  var resizeRaf = null;
  function requestResize() {
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      const rows = document.querySelectorAll("#tableBody tr");
      const rowH = rows.length ? rows[0].offsetHeight || 28 : 28;
      const theadH = (document.querySelector("thead") || { offsetHeight: 32 }).offsetHeight || 32;
      const toolbarH = document.getElementById("toolbar").offsetHeight;
      const bulkBar = document.getElementById("bulkBar");
      const bulkH = !bulkBar.classList.contains("hidden") ? bulkBar.offsetHeight : 0;
      const ep = document.getElementById("errorPanel");
      const epH = !ep.classList.contains("hidden") ? ep.offsetHeight : 0;
      const totalH = Math.min(800, Math.max(300, toolbarH + bulkH + epH + theadH + rows.length * rowH + 8));
      const totalW = Math.max(800, colWidths.reduce((a, b) => a + b, 0) + 20);
      parent.postMessage({ pluginMessage: { type: "resize", width: totalW, height: totalH } }, "*");
    });
  }

  // src/ui/bulk-editor.ts
  function updateBulkBar2() {
    const sel = selectedIds();
    const bar = document.getElementById("bulkBar");
    if (sel.length < 2) {
      bar.classList.add("hidden");
      bar.classList.remove("flex");
      updateToolbar();
      return;
    }
    bar.classList.remove("hidden");
    bar.classList.add("flex");
    const families = [...new Set(sel.map((id) => {
      const e = edits.get(id);
      if (e && e.changes.fontName) return e.changes.fontName.family;
      const s = styles.find((x) => x.id === id);
      return s ? s.fontName.family : null;
    }).filter(Boolean))];
    const bulkFamily = document.getElementById("bb-family").value.trim();
    const familyForOptions = bulkFamily || (families.length === 1 ? families[0] : "");
    populateBulkStyleOptions(familyForOptions);
    updateToolbar();
  }
  function populateBulkStyleOptions(family) {
    const bbStyle = document.getElementById("bb-style");
    const previousStyle = bbStyle.value;
    clearElement(bbStyle);
    const emptyOption = document.createElement("option");
    emptyOption.value = "";
    emptyOption.textContent = "\u2014";
    bbStyle.appendChild(emptyOption);
    const stylesForFamily = getFontStyles(family);
    if (stylesForFamily.length) {
      stylesForFamily.forEach((st) => {
        const o = document.createElement("option");
        o.value = o.textContent = st;
        if (st === previousStyle) o.selected = true;
        bbStyle.appendChild(o);
      });
    }
    if (previousStyle && !stylesForFamily.includes(previousStyle)) bbStyle.value = "";
  }
  document.getElementById("bulkBar").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-bulk-field]");
    if (btn) {
      e.stopPropagation();
      if (!isBindableVarField(btn.dataset.bulkField)) return;
      openVarPicker(null, btn.dataset.bulkField, btn, true);
      return;
    }
    const clearBtn = e.target.closest("[data-clear-bulk]");
    if (clearBtn) {
      delete bulkVarBindings[clearBtn.dataset.clearBulk];
      updateBulkVarChip(clearBtn.dataset.clearBulk);
    }
  });
  function updateBulkVarChip(field) {
    const chip = document.getElementById("bb-var-" + field);
    if (!chip) return;
    if (hasBulkVarBinding(field)) {
      const varId = bulkVarBindings[field];
      const info = variableMap.get(varId);
      chip.querySelector("span").textContent = varId === null ? "Unbind variable" : info ? info.name : varId;
      chip.classList.remove("hidden");
      chip.classList.add("flex");
    } else {
      chip.classList.add("hidden");
      chip.classList.remove("flex");
    }
  }
  document.getElementById("applyBulkBtn").addEventListener("click", () => {
    const sel = selectedIds();
    if (!sel.length) return;
    const family = document.getElementById("bb-family").value.trim();
    const styleSt = document.getElementById("bb-style").value;
    const size = parseFloat(document.getElementById("bb-size").value);
    const lhUnit = document.getElementById("bb-lhUnit").value;
    const lhVal = parseFloat(document.getElementById("bb-lhVal").value);
    const lsUnit = document.getElementById("bb-lsUnit").value;
    const lsVal = parseFloat(document.getElementById("bb-lsVal").value);
    const tc = document.getElementById("bb-case").value;
    const deco = document.getElementById("bb-deco").value;
    const lt = document.getElementById("bb-lt").value;
    const paraSp = parseFloat(document.getElementById("bb-paraSp").value);
    const indent = parseFloat(document.getElementById("bb-indent").value);
    const listSp = parseFloat(document.getElementById("bb-listSp").value);
    const hangList = document.getElementById("bb-hangList").value;
    const hangPunct = document.getElementById("bb-hangPunct").value;
    sel.forEach((id) => {
      const viewModel = styles.find((s) => s.id === id);
      if (!viewModel) return;
      if (family || styleSt) {
        const cur = edits.get(id) && edits.get(id).changes.fontName || viewModel.fontName;
        const nextFamily = family || cur.family;
        const nextStyle = styleSt || getValidStyleForFamily(nextFamily, cur.style);
        setChange(id, "fontName", { family: nextFamily, style: getValidStyleForFamily(nextFamily, nextStyle) });
      }
      if (!isNaN(size) && !hasBulkVarBinding("fontSize")) setChange(id, "fontSize", size);
      if (lhUnit === "AUTO" && !hasBulkVarBinding("lineHeight")) {
        setChange(id, "lineHeight", { unit: "AUTO" });
      } else if (lhUnit && !isNaN(lhVal) && !hasBulkVarBinding("lineHeight")) {
        setChange(id, "lineHeight", { unit: lhUnit, value: lhVal });
      }
      if (lsUnit && !isNaN(lsVal) && !hasBulkVarBinding("letterSpacing")) setChange(id, "letterSpacing", { unit: lsUnit, value: lsVal });
      if (tc) setChange(id, "textCase", tc);
      if (deco) setChange(id, "textDecoration", deco);
      if (lt) setChange(id, "leadingTrim", lt);
      if (!isNaN(paraSp) && !hasBulkVarBinding("paragraphSpacing")) setChange(id, "paragraphSpacing", paraSp);
      if (!isNaN(indent) && !hasBulkVarBinding("paragraphIndent")) setChange(id, "paragraphIndent", indent);
      if (!isNaN(listSp)) setChange(id, "listSpacing", listSp);
      if (hangList) setChange(id, "hangingList", hangList === "true");
      if (hangPunct) setChange(id, "hangingPunctuation", hangPunct === "true");
      for (const [field, varId] of Object.entries(bulkVarBindings)) {
        setVarBinding(id, field, varId);
      }
    });
    clearBulkVarBindings();
    ["fontSize", "lineHeight", "letterSpacing", "paragraphSpacing", "paragraphIndent"].forEach(updateBulkVarChip);
    renderTable();
  });
  registerBulkBarUpdater(updateBulkBar2);

  // src/ui/variable-picker.ts
  var vpState = null;
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#varPicker") && !e.target.classList.contains("vb-btn") && !e.target.classList.contains("bb-var-btn")) {
      closeVarPicker();
    }
  }, true);
  function openVarPicker2(id, field, anchorEl, isBulk) {
    if (!isBindableVarField(field)) return;
    vpState = { id, field, bulk: !!isBulk };
    const picker = document.getElementById("varPicker");
    picker.classList.remove("hidden");
    picker.classList.add("flex");
    document.getElementById("varPickerLabel").textContent = field.replace(/([A-Z])/g, " $1").toLowerCase();
    document.getElementById("varPickerSearch").value = "";
    renderVarPickerList("");
    const rect = anchorEl.getBoundingClientRect();
    let top = rect.bottom + 2, left = rect.left;
    if (left + 260 > window.innerWidth) left = window.innerWidth - 264;
    if (top + 300 > window.innerHeight) top = rect.top - 302;
    picker.style.top = top + "px";
    picker.style.left = left + "px";
    document.getElementById("varPickerSearch").focus();
  }
  function closeVarPicker() {
    const picker = document.getElementById("varPicker");
    picker.classList.add("hidden");
    picker.classList.remove("flex");
    vpState = null;
  }
  function renderVarPickerList(query) {
    const list = document.getElementById("varPickerList");
    clearElement(list);
    const q = query.toLowerCase();
    const filtered = variableList.filter(
      (v) => v.name.toLowerCase().includes(q) || v.collectionName.toLowerCase().includes(q)
    );
    if (!filtered.length) {
      const d = document.createElement("div");
      d.className = "px-2.5 py-1.5 text-ui italic text-ui-subtle";
      d.textContent = variableList.length ? "No matches" : "No FLOAT variables found";
      list.appendChild(d);
      return;
    }
    const currentId = vpState ? vpState.bulk ? bulkVarBindings[vpState.field] : getEffectiveVar(vpState.id, vpState.field) : null;
    filtered.forEach((v) => {
      const item = document.createElement("div");
      item.className = "flex cursor-pointer flex-col gap-px px-2.5 py-[5px] text-ui hover:bg-ui-hover" + (v.id === currentId ? " bg-ui-bound" : "");
      const nm = document.createElement("span");
      nm.className = "font-medium";
      nm.textContent = v.name;
      const col = document.createElement("span");
      col.className = "text-micro text-ui-subtle";
      col.textContent = v.collectionName;
      item.appendChild(nm);
      item.appendChild(col);
      item.addEventListener("click", () => {
        if (vpState) {
          if (vpState.bulk) {
            bulkVarBindings[vpState.field] = v.id;
            updateBulkVarChip(vpState.field);
          } else {
            setVarBinding(vpState.id, vpState.field, v.id);
            refreshRow(vpState.id);
          }
        }
        closeVarPicker();
      });
      list.appendChild(item);
    });
  }
  document.getElementById("varPickerSearch").addEventListener("input", (e) => renderVarPickerList(e.target.value));
  document.getElementById("varPickerClear").addEventListener("click", () => {
    if (vpState) {
      if (vpState.bulk) {
        bulkVarBindings[vpState.field] = null;
        updateBulkVarChip(vpState.field);
      } else {
        setVarBinding(vpState.id, vpState.field, null);
        refreshRow(vpState.id);
      }
    }
    closeVarPicker();
  });
  registerVarPickerOpener(openVarPicker2);

  // src/ui/init.ts
  buildHeader();
  parent.postMessage({ pluginMessage: { type: "load-styles" } }, "*");
})();

</script>
</body>
</html>
