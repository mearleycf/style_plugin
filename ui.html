<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bulk Typography Style Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11px;background:#fff;color:#1a1a1a;overflow:hidden;height:100vh;display:flex;flex-direction:column}

/* ── toolbar ── */
#toolbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#f5f5f5;border-bottom:1px solid #ddd;flex-shrink:0;overflow:hidden}
#toolbar button{padding:3px 8px;font-size:11px;border:1px solid #ccc;border-radius:3px;background:#fff;cursor:pointer}
#toolbar button:hover{background:#e8e8e8}
#toolbar button:disabled{opacity:.45;cursor:default}
#applyBtn{background:#0d99ff;color:#fff;border-color:#0d99ff;font-weight:600}
#applyBtn:hover:not(:disabled){background:#0b88e8}
#selInfo{font-size:11px;color:#555}
#filterWrap{display:flex;align-items:center;gap:4px;flex:1;min-width:160px;max-width:340px}
#filterName{flex:1;font-size:11px;border:1px solid #ccc;border-radius:3px;padding:3px 6px;outline:none}
#filterName:focus{border-color:#0d99ff}
#filterName.active{border-color:#0d99ff;background:#e3f2fd}
#clearFilterBtn{font-size:10px;padding:2px 6px;display:none}

/* ── bulk bar ── */
#bulkBar{display:none;align-items:center;gap:6px;padding:4px 8px;background:#fff8e1;border-bottom:1px solid #ffe082;flex-shrink:0;flex-wrap:wrap}
#bulkBar label{font-size:11px;color:#555;white-space:nowrap}
#bulkBar input[type=number],#bulkBar select{font-size:11px;border:1px solid #ccc;border-radius:3px;padding:2px 4px;width:76px}
#bulkBar .bb-group{display:flex;align-items:center;gap:3px}
#bulkBar .bb-sep{width:1px;height:18px;background:#ddd;margin:0 2px}
#applyBulkBtn{padding:3px 8px;font-size:11px;border:1px solid #0d99ff;border-radius:3px;background:#0d99ff;color:#fff;cursor:pointer;font-weight:600}

/* bulk var chip */
.bb-var-chip{display:flex;align-items:center;gap:2px;background:#e3f2fd;border:1px solid #0d99ff;border-radius:10px;padding:1px 6px;font-size:10px;color:#0d99ff;max-width:120px}
.bb-var-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.bb-var-chip button{border:none;background:none;color:#0d99ff;cursor:pointer;padding:0;font-size:10px;line-height:1;flex-shrink:0}
.bb-var-btn{flex-shrink:0;width:18px;height:18px;border:1px solid #bbb;border-radius:3px;background:#f5f5f5;cursor:pointer;font-size:10px;color:#555;padding:0;line-height:16px;text-align:center}
.bb-var-btn:hover{background:#e0e8ff;border-color:#0d99ff;color:#0d99ff}

/* ── error panel ── */
#errorPanel{display:none;padding:6px 10px;background:#fff3f3;border-bottom:1px solid #ffcdd2;font-size:11px;color:#c62828;flex-shrink:0;max-height:80px;overflow-y:auto}

/* ── table ── */
#tableWrap{flex:1;overflow:auto;position:relative}
table{border-collapse:collapse;table-layout:fixed;min-width:100%}
thead th{
  position:sticky;top:0;z-index:10;
  background:#f0f0f0;border-bottom:2px solid #ccc;border-right:1px solid #ddd;
  padding:4px 4px;font-size:10px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;
  user-select:none;
}
thead th .th-inner{display:flex;align-items:center;overflow:hidden}
thead th .th-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
thead th .th-resize{width:4px;height:100%;position:absolute;right:0;top:0;cursor:col-resize;background:transparent}

tbody tr{border-bottom:1px solid #eee}
tbody tr:hover{background:#f7f9ff}
tbody tr.dirty{background:#fff8e1}
tbody tr.dirty:hover{background:#fff3cc}

td{border-right:1px solid #eee;padding:2px 3px;vertical-align:middle;overflow:hidden}
td input[type=text],td input[type=number],td select{
  width:100%;font-size:11px;border:1px solid transparent;border-radius:2px;padding:1px 3px;background:transparent;outline:none;
}
td input[type=text]:focus,td input[type=number]:focus,td select:focus{border-color:#0d99ff;background:#fff}
td input[type=checkbox]{cursor:pointer}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-ok{background:#4caf50}
.dot-err{background:#f44336}
.dot-pending{background:#ff9800}
.state-cell{text-align:center;padding:2px}

/* var-bind cell */
.vb-wrap{display:flex;align-items:center;gap:2px;width:100%}
.vb-wrap input{flex:1;min-width:0}
.vb-btn{
  flex-shrink:0;width:16px;height:16px;border:1px solid #bbb;border-radius:2px;
  background:#f5f5f5;cursor:pointer;font-size:9px;line-height:14px;text-align:center;color:#555;padding:0;
}
.vb-btn:hover{background:#e0e8ff;border-color:#0d99ff;color:#0d99ff}
.vb-bound .vb-btn{background:#e3f2fd;border-color:#0d99ff;color:#0d99ff}
.vb-bound input{color:#0d99ff;font-style:italic}

/* unit+value+var cells */
.uv-wrap{display:flex;align-items:center;gap:2px;width:100%}
.uv-wrap select.unit-sel{width:52px;flex-shrink:0;font-size:10px}
.uv-wrap input{flex:1;min-width:0}

/* floating var picker */
#varPicker{
  display:none;position:fixed;z-index:1000;background:#fff;border:1px solid #bbb;
  border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.18);width:260px;max-height:300px;
  flex-direction:column;
}
#varPicker.open{display:flex}
#varPickerLabel{padding:4px 10px 0;font-size:10px;color:#888;font-weight:600;text-transform:uppercase}
#varPickerSearch{padding:6px 8px;border:none;border-bottom:1px solid #ddd;font-size:11px;outline:none}
#varPickerList{flex:1;overflow-y:auto}
.vp-item{padding:5px 10px;cursor:pointer;font-size:11px;display:flex;flex-direction:column;gap:1px}
.vp-item:hover{background:#f0f4ff}
.vp-item.selected{background:#e3f2fd}
.vp-name{font-weight:500}
.vp-coll{font-size:10px;color:#888}
.vp-none{padding:6px 10px;color:#999;font-size:11px;font-style:italic}
#varPickerClear{padding:5px 10px;border-top:1px solid #eee;font-size:11px;color:#c62828;cursor:pointer}
#varPickerClear:hover{background:#fff3f3}
</style>
</head>
<body>

<div id="toolbar">
  <button id="reloadBtn">&#8635; Reload</button>
  <button id="applyBtn" disabled>Apply changes</button>
  <button id="clearBtn" disabled>Clear edits</button>
  <div id="filterWrap">
    <input id="filterName" type="text" placeholder="Filter by name…" list="nameGroupList" autocomplete="off"/>
    <button id="clearFilterBtn" title="Clear filter">&#x2715;</button>
  </div>
  <span id="selInfo">Loading…</span>
</div>

<datalist id="nameGroupList"></datalist>

<div id="bulkBar">
  <strong style="font-size:11px;margin-right:4px">Bulk edit selected:</strong>

  <div class="bb-group"><label>Family</label><input id="bb-family" type="text" placeholder="Family…" style="width:100px"/></div>
  <div class="bb-group"><label>Style</label><select id="bb-style"><option value="">—</option></select></div>
  <div class="bb-sep"></div>

  <div class="bb-group">
    <label>Size</label>
    <input id="bb-size" type="number" min="1" step="0.5" placeholder="—"/>
    <button class="bb-var-btn" data-bulk-field="fontSize" title="Bind variable to font size">⚡</button>
    <div id="bb-var-fontSize" class="bb-var-chip" style="display:none"><span></span><button data-clear-bulk="fontSize">✕</button></div>
  </div>
  <div class="bb-sep"></div>

  <div class="bb-group">
    <label>LH</label>
    <select id="bb-lhUnit"><option value="">—</option><option>AUTO</option><option>PIXELS</option><option>PERCENT</option></select>
    <input id="bb-lhVal" type="number" min="0" step="0.5" placeholder="val"/>
    <button class="bb-var-btn" data-bulk-field="lineHeight" title="Bind variable to line height">⚡</button>
    <div id="bb-var-lineHeight" class="bb-var-chip" style="display:none"><span></span><button data-clear-bulk="lineHeight">✕</button></div>
  </div>
  <div class="bb-sep"></div>

  <div class="bb-group">
    <label>LS</label>
    <select id="bb-lsUnit"><option value="">—</option><option>PIXELS</option><option>PERCENT</option></select>
    <input id="bb-lsVal" type="number" step="0.1" placeholder="val"/>
  </div>
  <div class="bb-sep"></div>

  <div class="bb-group"><label>Case</label>
    <select id="bb-case">
      <option value="">—</option><option>ORIGINAL</option><option>UPPER</option><option>LOWER</option>
      <option>TITLE</option><option>SMALL_CAPS</option><option>SMALL_CAPS_FORCED</option>
    </select>
  </div>
  <div class="bb-group"><label>Decor</label>
    <select id="bb-deco"><option value="">—</option><option>NONE</option><option>UNDERLINE</option><option>STRIKETHROUGH</option></select>
  </div>
  <div class="bb-group"><label>Lead Trim</label>
    <select id="bb-lt"><option value="">—</option><option>NONE</option><option>CAP_HEIGHT</option></select>
  </div>
  <div class="bb-sep"></div>

  <div class="bb-group">
    <label>Para Sp</label>
    <input id="bb-paraSp" type="number" min="0" step="0.5" placeholder="—"/>
    <button class="bb-var-btn" data-bulk-field="paragraphSpacing" title="Bind variable to paragraph spacing">⚡</button>
    <div id="bb-var-paragraphSpacing" class="bb-var-chip" style="display:none"><span></span><button data-clear-bulk="paragraphSpacing">✕</button></div>
  </div>

  <div class="bb-group">
    <label>Indent</label>
    <input id="bb-indent" type="number" min="0" step="0.5" placeholder="—"/>
    <button class="bb-var-btn" data-bulk-field="paragraphIndent" title="Bind variable to paragraph indent">⚡</button>
    <div id="bb-var-paragraphIndent" class="bb-var-chip" style="display:none"><span></span><button data-clear-bulk="paragraphIndent">✕</button></div>
  </div>

  <div class="bb-group">
    <label>List Sp</label>
    <input id="bb-listSp" type="number" min="0" step="0.5" placeholder="—"/>
    <button class="bb-var-btn" data-bulk-field="listSpacing" title="Bind variable to list spacing">⚡</button>
    <div id="bb-var-listSpacing" class="bb-var-chip" style="display:none"><span></span><button data-clear-bulk="listSpacing">✕</button></div>
  </div>

  <button id="applyBulkBtn">Apply to selected</button>
</div>

<div id="errorPanel"></div>

<div id="tableWrap">
  <table id="styleTable">
    <colgroup id="colgroup"></colgroup>
    <thead><tr id="headerRow"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div id="varPicker">
  <div id="varPickerLabel"></div>
  <input id="varPickerSearch" type="text" placeholder="Search variables…"/>
  <div id="varPickerList"></div>
  <div id="varPickerClear">&#x2715; Unbind variable</div>
</div>

<script>
// ─── column definitions ────────────────────────────────────────────
const COLS = [
  { key:'check',  label:'',           w:32,  resizable:false },
  { key:'state',  label:'',           w:28,  resizable:false },
  { key:'name',   label:'Name',       w:300, resizable:true  },
  { key:'family', label:'Family',     w:140, resizable:true  },
  { key:'style',  label:'Style',      w:100, resizable:true  },
  { key:'size',   label:'Size',       w:90,  resizable:true  },
  { key:'lh',     label:'Line Ht',    w:110, resizable:true  },
  { key:'ls',     label:'Letter Sp',  w:100, resizable:true  },
  { key:'paraSp', label:'Para Sp',    w:90,  resizable:true  },
  { key:'indent', label:'Indent',     w:90,  resizable:true  },
  { key:'listSp', label:'List Sp',    w:80,  resizable:true  },
  { key:'case',   label:'Case',       w:80,  resizable:true  },
  { key:'deco',   label:'Decoration', w:85,  resizable:true  },
  { key:'lt',     label:'Lead Trim',  w:85,  resizable:true  },
  { key:'hangL',  label:'Hang List',  w:70,  resizable:true  },
  { key:'hangP',  label:'Hang Punct', w:70,  resizable:true  },
];

// ─── state ────────────────────────────────────────────────────────────────────────────────
let colWidths = COLS.map(c => c.w);
let styles = [];
let fontMap = {};
let variableList = [];
let variableMap = new Map();
let edits = new Map();
let applyStatus = new Map();
let nameFilter = '';
let bulkVarBindings = {};

// ─── header ─────────────────────────────────────────────────────────────────────────────
function buildHeader() {
  const cg = document.getElementById('colgroup');
  const hr = document.getElementById('headerRow');
  cg.innerHTML = '';
  hr.innerHTML = '';
  COLS.forEach((col, i) => {
    const c = document.createElement('col');
    c.style.width = colWidths[i] + 'px';
    cg.appendChild(c);

    const th = document.createElement('th');
    th.style.position = 'relative';
    if (col.key === 'check') {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = 'selectAll';
      cb.addEventListener('change', onSelectAll);
      th.appendChild(cb);
    } else {
      const inner = document.createElement('div');
      inner.className = 'th-inner';
      const lbl = document.createElement('span');
      lbl.className = 'th-label';
      lbl.textContent = col.label;
      inner.appendChild(lbl);
      th.appendChild(inner);
    }
    if (col.resizable) {
      const handle = document.createElement('div');
      handle.className = 'th-resize';
      handle.addEventListener('mousedown', e => startResize(e, i));
      th.appendChild(handle);
    }
    hr.appendChild(th);
  });
}

// ─── column resize ────────────────────────────────────────────────────────────────────
let resizeState = null;
function startResize(e, colIdx) {
  e.preventDefault();
  resizeState = { colIdx, startX: e.clientX, startW: colWidths[colIdx] };
  document.addEventListener('mousemove', onResizeMove);
  document.addEventListener('mouseup', onResizeUp);
}
function onResizeMove(e) {
  if (!resizeState) return;
  colWidths[resizeState.colIdx] = Math.max(30, resizeState.startW + (e.clientX - resizeState.startX));
  applyColWidths();
}
function onResizeUp() {
  resizeState = null;
  document.removeEventListener('mousemove', onResizeMove);
  document.removeEventListener('mouseup', onResizeUp);
  requestResize();
}
function applyColWidths() {
  document.querySelectorAll('#colgroup col').forEach((c, i) => { c.style.width = colWidths[i] + 'px'; });
}

// ─── name filter ─────────────────────────────────────────────────────────────────────────────
function getFilteredStyles() {
  if (!nameFilter) return styles;
  const q = nameFilter.toLowerCase();
  return styles.filter(s => s.name.toLowerCase().includes(q));
}

function refreshNameGroupList() {
  const dl = document.getElementById('nameGroupList');
  dl.innerHTML = '';
  const groups = new Set();
  styles.forEach(s => {
    const parts = s.name.split('/');
    for (let i = 1; i < parts.length; i++) {
      groups.add(parts.slice(0, i).join('/'));
    }
  });
  [...groups].sort().forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    dl.appendChild(opt);
  });
}

document.getElementById('filterName').addEventListener('input', e => {
  nameFilter = e.target.value;
  e.target.classList.toggle('active', !!nameFilter);
  document.getElementById('clearFilterBtn').style.display = nameFilter ? '' : 'none';
  renderTable();
});

document.getElementById('clearFilterBtn').addEventListener('click', () => {
  nameFilter = '';
  const inp = document.getElementById('filterName');
  inp.value = '';
  inp.classList.remove('active');
  document.getElementById('clearFilterBtn').style.display = 'none';
  renderTable();
});

// ─── edit helpers ───────────────────────────────────────────────────────────────────────────
function getEdit(id) {
  if (!edits.has(id)) edits.set(id, { changes: {}, varBindings: {} });
  return edits.get(id);
}
function setChange(id, field, value) {
  getEdit(id).changes[field] = value;
  markDirty(id);
}
function setVarBinding(id, field, variableId) {
  getEdit(id).varBindings[field] = variableId;
  markDirty(id);
}
function getEffectiveVar(id, field) {
  const e = edits.get(id);
  if (e && field in e.varBindings) return e.varBindings[field];
  const snap = styles.find(s => s.id === id);
  return snap ? (snap.boundVars[field] ?? null) : null;
}
function getEditedValue(id, field) {
  const e = edits.get(id);
  return e && field in e.changes ? e.changes[field] : null;
}
function markDirty(id) {
  const row = document.querySelector('tr[data-id="' + CSS.escape(id) + '"]');
  if (row) { row.classList.add('dirty'); updateStateDot(row, id); }
  updateToolbar();
}
function isDirty(id) {
  const e = edits.get(id);
  if (!e) return false;
  return Object.keys(e.changes).length > 0 || Object.keys(e.varBindings).length > 0;
}
function updateStateDot(row, id) {
  const cell = row.querySelector('.state-cell');
  if (!cell) return;
  cell.innerHTML = '';
  const status = applyStatus.get(id);
  if (status) {
    const dot = document.createElement('span');
    dot.className = 'dot ' + (status.ok ? 'dot-ok' : 'dot-err');
    dot.title = status.error || 'OK';
    cell.appendChild(dot);
  } else if (isDirty(id)) {
    const dot = document.createElement('span');
    dot.className = 'dot dot-pending';
    dot.title = 'Unsaved changes';
    cell.appendChild(dot);
  }
}

// ─── selection ────────────────────────────────────────────────────────────────────────────────
function selectedIds() {
  return [...document.querySelectorAll('tbody tr input.row-check:checked')]
    .map(cb => cb.closest('tr').dataset.id);
}
function onSelectAll(e) {
  document.querySelectorAll('tbody tr input.row-check').forEach(cb => { cb.checked = e.target.checked; });
  updateBulkBar();
  updateToolbar();
}
function updateSelectAll() {
  const all   = document.querySelectorAll('tbody tr input.row-check').length;
  const checked = document.querySelectorAll('tbody tr input.row-check:checked').length;
  const sa = document.getElementById('selectAll');
  if (!sa) return;
  sa.indeterminate = checked > 0 && checked < all;
  sa.checked = all > 0 && checked === all;
}

// ─── toolbar ──────────────────────────────────────────────────────────────────────────────────
function updateToolbar() {
  const dirtyCount = styles.filter(s => isDirty(s.id)).length;
  const sel = selectedIds();
  const filtered = getFilteredStyles();
  const applyBtn = document.getElementById('applyBtn');
  applyBtn.disabled = dirtyCount === 0;
  applyBtn.textContent = dirtyCount > 0 ? 'Apply changes (' + dirtyCount + ')' : 'Apply changes';
  document.getElementById('clearBtn').disabled = dirtyCount === 0;
  document.getElementById('selInfo').textContent =
    sel.length ? sel.length + ' selected' :
    (nameFilter ? filtered.length + ' / ' + styles.length + ' styles' : styles.length + ' styles');
  updateSelectAll();
}

// ─── bulk bar ─────────────────────────────────────────────────────────────────────────────────
function updateBulkBar() {
  const sel = selectedIds();
  const bar = document.getElementById('bulkBar');
  if (sel.length < 2) { bar.style.display = 'none'; updateToolbar(); return; }
  bar.style.display = 'flex';

  const families = [...new Set(sel.map(id => {
    const e = edits.get(id);
    if (e && e.changes.fontName) return e.changes.fontName.family;
    const s = styles.find(x => x.id === id);
    return s ? s.fontName.family : null;
  }).filter(Boolean))];
  const bbStyle = document.getElementById('bb-style');
  bbStyle.innerHTML = '<option value="">—</option>';
  if (families.length === 1 && fontMap[families[0]]) {
    fontMap[families[0]].forEach(st => {
      const o = document.createElement('option');
      o.value = o.textContent = st;
      bbStyle.appendChild(o);
    });
  }
  updateToolbar();
}

// ─── bulk variable bindings ────────────────────────────────────────────────────────────────
document.getElementById('bulkBar').addEventListener('click', e => {
  const btn = e.target.closest('[data-bulk-field]');
  if (btn) {
    e.stopPropagation();
    openVarPicker(null, btn.dataset.bulkField, btn, true);
    return;
  }
  const clearBtn = e.target.closest('[data-clear-bulk]');
  if (clearBtn) {
    delete bulkVarBindings[clearBtn.dataset.clearBulk];
    updateBulkVarChip(clearBtn.dataset.clearBulk);
  }
});

function updateBulkVarChip(field) {
  const chip = document.getElementById('bb-var-' + field);
  if (!chip) return;
  const varId = bulkVarBindings[field];
  if (varId) {
    const info = variableMap.get(varId);
    chip.querySelector('span').textContent = info ? info.name : varId;
    chip.style.display = 'flex';
  } else {
    chip.style.display = 'none';
  }
}

document.getElementById('applyBulkBtn').addEventListener('click', () => {
  const sel = selectedIds();
  if (!sel.length) return;

  const family  = document.getElementById('bb-family').value.trim();
  const styleSt = document.getElementById('bb-style').value;
  const size    = parseFloat(document.getElementById('bb-size').value);
  const lhUnit  = document.getElementById('bb-lhUnit').value;
  const lhVal   = parseFloat(document.getElementById('bb-lhVal').value);
  const lsUnit  = document.getElementById('bb-lsUnit').value;
  const lsVal   = parseFloat(document.getElementById('bb-lsVal').value);
  const tc      = document.getElementById('bb-case').value;
  const deco    = document.getElementById('bb-deco').value;
  const lt      = document.getElementById('bb-lt').value;
  const paraSp  = parseFloat(document.getElementById('bb-paraSp').value);
  const indent  = parseFloat(document.getElementById('bb-indent').value);
  const listSp  = parseFloat(document.getElementById('bb-listSp').value);

  sel.forEach(id => {
    const snap = styles.find(s => s.id === id);
    if (!snap) return;

    if (family || styleSt) {
      const cur = (edits.get(id) && edits.get(id).changes.fontName) || snap.fontName;
      setChange(id, 'fontName', { family: family || cur.family, style: styleSt || cur.style });
    }
    if (!isNaN(size) && !bulkVarBindings['fontSize'])             setChange(id, 'fontSize', size);
    if (lhUnit === 'AUTO' && !bulkVarBindings['lineHeight']) {
      setChange(id, 'lineHeight', { unit: 'AUTO' });
    } else if (lhUnit && !isNaN(lhVal) && !bulkVarBindings['lineHeight']) {
      setChange(id, 'lineHeight', { unit: lhUnit, value: lhVal });
    }
    if (lsUnit && !isNaN(lsVal))                                  setChange(id, 'letterSpacing', { unit: lsUnit, value: lsVal });
    if (tc)                                                        setChange(id, 'textCase', tc);
    if (deco)                                                      setChange(id, 'textDecoration', deco);
    if (lt)                                                        setChange(id, 'leadingTrim', lt);
    if (!isNaN(paraSp) && !bulkVarBindings['paragraphSpacing'])   setChange(id, 'paragraphSpacing', paraSp);
    if (!isNaN(indent) && !bulkVarBindings['paragraphIndent'])    setChange(id, 'paragraphIndent', indent);
    if (!isNaN(listSp) && !bulkVarBindings['listSpacing'])        setChange(id, 'listSpacing', listSp);

    for (const [field, varId] of Object.entries(bulkVarBindings)) {
      setVarBinding(id, field, varId);
    }
  });

  bulkVarBindings = {};
  ['fontSize','lineHeight','paragraphSpacing','paragraphIndent','listSpacing'].forEach(updateBulkVarChip);
  renderTable();
  sendApply();
});

// ─── variable picker ───────────────────────────────────────────────────────────────────────
let vpState = null;

document.addEventListener('click', e => {
  if (!e.target.closest('#varPicker') && !e.target.classList.contains('vb-btn') && !e.target.classList.contains('bb-var-btn')) {
    closeVarPicker();
  }
}, true);

function openVarPicker(id, field, anchorEl, isBulk) {
  vpState = { id, field, bulk: !!isBulk };
  const picker = document.getElementById('varPicker');
  picker.classList.add('open');
  document.getElementById('varPickerLabel').textContent = field.replace(/([A-Z])/g, ' $1').toLowerCase();
  document.getElementById('varPickerSearch').value = '';
  document.getElementById('varPickerClear').style.display = isBulk ? 'none' : '';
  renderVarPickerList('');
  const rect = anchorEl.getBoundingClientRect();
  let top = rect.bottom + 2, left = rect.left;
  if (left + 260 > window.innerWidth)  left = window.innerWidth - 264;
  if (top  + 300 > window.innerHeight) top  = rect.top - 302;
  picker.style.top = top + 'px';
  picker.style.left = left + 'px';
  document.getElementById('varPickerSearch').focus();
}
function closeVarPicker() {
  document.getElementById('varPicker').classList.remove('open');
  vpState = null;
}
function renderVarPickerList(query) {
  const list = document.getElementById('varPickerList');
  list.innerHTML = '';
  const q = query.toLowerCase();
  const filtered = variableList.filter(v =>
    v.name.toLowerCase().includes(q) || v.collectionName.toLowerCase().includes(q)
  );
  if (!filtered.length) {
    const d = document.createElement('div');
    d.className = 'vp-none';
    d.textContent = variableList.length ? 'No matches' : 'No FLOAT variables found';
    list.appendChild(d);
    return;
  }
  const currentId = vpState ? (
    vpState.bulk ? bulkVarBindings[vpState.field] : getEffectiveVar(vpState.id, vpState.field)
  ) : null;
  filtered.forEach(v => {
    const item = document.createElement('div');
    item.className = 'vp-item' + (v.id === currentId ? ' selected' : '');
    const nm = document.createElement('span'); nm.className = 'vp-name'; nm.textContent = v.name;
    const col = document.createElement('span'); col.className = 'vp-coll'; col.textContent = v.collectionName;
    item.appendChild(nm); item.appendChild(col);
    item.addEventListener('click', () => {
      if (vpState) {
        if (vpState.bulk) {
          bulkVarBindings[vpState.field] = v.id;
          updateBulkVarChip(vpState.field);
        } else {
          setVarBinding(vpState.id, vpState.field, v.id);
          refreshRow(vpState.id);
        }
      }
      closeVarPicker();
    });
    list.appendChild(item);
  });
}
document.getElementById('varPickerSearch').addEventListener('input', e => renderVarPickerList(e.target.value));
document.getElementById('varPickerClear').addEventListener('click', () => {
  if (vpState && !vpState.bulk) {
    setVarBinding(vpState.id, vpState.field, null);
    refreshRow(vpState.id);
  }
  closeVarPicker();
});

// ─── cell builders ─────────────────────────────────────────────────────────────────────────────
function makeVbCell(id, field, numericValue, isBound) {
  const wrap = document.createElement('div');
  wrap.className = 'vb-wrap' + (isBound ? ' vb-bound' : '');
  const inp = document.createElement('input');
  inp.type = isBound ? 'text' : 'number';
  inp.step = '0.5';
  if (isBound) {
    const info = variableMap.get(getEffectiveVar(id, field));
    inp.value = info ? info.name : '(var)';
    inp.readOnly = true;
  } else {
    inp.value = numericValue;
    inp.addEventListener('change', e => { const v = parseFloat(e.target.value); if (!isNaN(v)) setChange(id, field, v); });
  }
  wrap.appendChild(inp);
  const btn = document.createElement('button');
  btn.className = 'vb-btn';
  btn.title = isBound ? 'Change / unbind variable' : 'Bind variable';
  btn.textContent = '⚡';
  btn.addEventListener('mousedown', e => e.stopPropagation());
  btn.addEventListener('click', e => { e.stopPropagation(); openVarPicker(id, field, btn, false); });
  wrap.appendChild(btn);
  return wrap;
}

function makeUvVbCell(id, field, uvValue, isBound) {
  const wrap = document.createElement('div');
  wrap.className = 'uv-wrap' + (isBound ? ' vb-bound' : '');
  if (isBound) {
    const inp = document.createElement('input');
    inp.type = 'text';
    const info = variableMap.get(getEffectiveVar(id, field));
    inp.value = info ? info.name : '(var)';
    inp.readOnly = true;
    inp.style.flex = '1';
    wrap.appendChild(inp);
  } else {
    const units = field === 'letterSpacing' ? ['PIXELS','PERCENT'] : ['AUTO','PIXELS','PERCENT'];
    const sel = document.createElement('select');
    sel.className = 'unit-sel';
    units.forEach(u => {
      const o = document.createElement('option');
      o.value = o.textContent = u;
      if (u === uvValue.unit) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', e => {
      const newUnit = e.target.value;
      const cur = getEditedValue(id, field) || uvValue;
      if (newUnit === 'AUTO') {
        setChange(id, field, { unit: 'AUTO' });
      } else {
        setChange(id, field, { unit: newUnit, value: cur.unit === 'AUTO' ? 0 : (cur.value || 0) });
      }
      refreshRow(id);
    });
    wrap.appendChild(sel);
    if (uvValue.unit !== 'AUTO') {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.step = '0.5';
      inp.value = uvValue.value != null ? uvValue.value : '';
      inp.style.flex = '1'; inp.style.minWidth = '0';
      inp.addEventListener('change', e => {
        const v = parseFloat(e.target.value);
        if (!isNaN(v)) setChange(id, field, { unit: uvValue.unit, value: v });
      });
      wrap.appendChild(inp);
    }
  }
  const btn = document.createElement('button');
  btn.className = 'vb-btn';
  btn.title = isBound ? 'Change / unbind variable' : 'Bind variable';
  btn.textContent = '⚡';
  btn.addEventListener('mousedown', e => e.stopPropagation());
  btn.addEventListener('click', e => { e.stopPropagation(); openVarPicker(id, field, btn, false); });
  wrap.appendChild(btn);
  return wrap;
}

function makeSelect(opts, current, onChange) {
  const sel = document.createElement('select');
  sel.style.cssText = 'width:100%;font-size:11px;border:1px solid transparent;border-radius:2px;background:transparent;';
  opts.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o;
    opt.textContent = o.replace(/_/g,' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    if (o === current) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', e => onChange(e.target.value));
  return sel;
}

// ─── row builder ──────────────────────────────────────────────────────────────────────────────
function buildRow(snap) {
  const id = snap.id;
  const e = edits.get(id) || { changes:{}, varBindings:{} };
  const c = e.changes;
  const status = applyStatus.get(id);

  const fn     = c.fontName         ?? snap.fontName;
  const fs     = c.fontSize         ?? snap.fontSize;
  const lh     = c.lineHeight       ?? snap.lineHeight;
  const ls     = c.letterSpacing    ?? snap.letterSpacing;
  const paraSp = c.paragraphSpacing ?? snap.paragraphSpacing;
  const indent = c.paragraphIndent  ?? snap.paragraphIndent;
  const listSp = c.listSpacing      ?? snap.listSpacing;
  const tc     = c.textCase         ?? snap.textCase;
  const deco   = c.textDecoration   ?? snap.textDecoration;
  const lt     = c.leadingTrim      ?? snap.leadingTrim;
  const hangL  = c.hangingList      ?? snap.hangingList;
  const hangP  = c.hangingPunctuation ?? snap.hangingPunctuation;

  const varFs     = getEffectiveVar(id, 'fontSize');
  const varLh     = getEffectiveVar(id, 'lineHeight');
  const varLs     = getEffectiveVar(id, 'letterSpacing');
  const varParaSp = getEffectiveVar(id, 'paragraphSpacing');
  const varIndent = getEffectiveVar(id, 'paragraphIndent');
  const varListSp = getEffectiveVar(id, 'listSpacing');

  const tr = document.createElement('tr');
  tr.dataset.id = id;
  if (isDirty(id)) tr.classList.add('dirty');

  function td(content) {
    const cell = document.createElement('td');
    if (content instanceof Node) cell.appendChild(content);
    else if (content !== undefined) cell.textContent = content;
    return cell;
  }

  const cbCell = document.createElement('td');
  const rowCb = document.createElement('input');
  rowCb.type = 'checkbox'; rowCb.className = 'row-check';
  rowCb.addEventListener('change', () => { updateBulkBar(); updateToolbar(); });
  cbCell.appendChild(rowCb);
  tr.appendChild(cbCell);

  const stateCell = document.createElement('td');
  stateCell.className = 'state-cell';
  if (status) {
    const dot = document.createElement('span');
    dot.className = 'dot ' + (status.ok ? 'dot-ok' : 'dot-err');
    dot.title = status.error || 'OK';
    stateCell.appendChild(dot);
  } else if (isDirty(id)) {
    const dot = document.createElement('span');
    dot.className = 'dot dot-pending';
    dot.title = 'Unsaved changes';
    stateCell.appendChild(dot);
  }
  tr.appendChild(stateCell);

  const nameInp = document.createElement('input');
  nameInp.type = 'text'; nameInp.value = c.name ?? snap.name;
  nameInp.addEventListener('change', ev => setChange(id, 'name', ev.target.value));
  tr.appendChild(td(nameInp));

  const famInp = document.createElement('input');
  famInp.type = 'text'; famInp.value = fn.family;
  famInp.addEventListener('change', ev => {
    const cur = (edits.get(id) && edits.get(id).changes.fontName) || snap.fontName;
    setChange(id, 'fontName', { family: ev.target.value, style: cur.style });
    updateBulkBar();
  });
  tr.appendChild(td(famInp));

  const styleCell = document.createElement('td');
  const availStyles = fontMap[fn.family];
  if (availStyles && availStyles.length) {
    const sel = document.createElement('select');
    sel.style.cssText = 'width:100%;font-size:11px;border:1px solid transparent;border-radius:2px;background:transparent;';
    availStyles.forEach(st => {
      const o = document.createElement('option'); o.value = o.textContent = st;
      if (st === fn.style) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', ev => {
      const cur = (edits.get(id) && edits.get(id).changes.fontName) || snap.fontName;
      setChange(id, 'fontName', { family: cur.family, style: ev.target.value });
    });
    styleCell.appendChild(sel);
  } else {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.value = fn.style;
    inp.addEventListener('change', ev => {
      const cur = (edits.get(id) && edits.get(id).changes.fontName) || snap.fontName;
      setChange(id, 'fontName', { family: cur.family, style: ev.target.value });
    });
    styleCell.appendChild(inp);
  }
  tr.appendChild(styleCell);

  tr.appendChild(td(makeVbCell(id, 'fontSize', fs, !!varFs)));
  tr.appendChild(td(makeUvVbCell(id, 'lineHeight', lh, !!varLh)));
  tr.appendChild(td(makeUvVbCell(id, 'letterSpacing', ls, !!varLs)));
  tr.appendChild(td(makeVbCell(id, 'paragraphSpacing', paraSp, !!varParaSp)));
  tr.appendChild(td(makeVbCell(id, 'paragraphIndent', indent, !!varIndent)));
  tr.appendChild(td(makeVbCell(id, 'listSpacing', listSp, !!varListSp)));
  tr.appendChild(td(makeSelect(['ORIGINAL','UPPER','LOWER','TITLE','SMALL_CAPS','SMALL_CAPS_FORCED'], tc, v => setChange(id, 'textCase', v))));
  tr.appendChild(td(makeSelect(['NONE','UNDERLINE','STRIKETHROUGH'], deco, v => setChange(id, 'textDecoration', v))));
  tr.appendChild(td(makeSelect(['NONE','CAP_HEIGHT'], lt, v => setChange(id, 'leadingTrim', v))));

  const hangLCell = document.createElement('td'); hangLCell.style.textAlign = 'center';
  const hangLCb = document.createElement('input'); hangLCb.type = 'checkbox'; hangLCb.checked = !!hangL;
  hangLCb.addEventListener('change', ev => setChange(id, 'hangingList', ev.target.checked));
  hangLCell.appendChild(hangLCb); tr.appendChild(hangLCell);

  const hangPCell = document.createElement('td'); hangPCell.style.textAlign = 'center';
  const hangPCb = document.createElement('input'); hangPCb.type = 'checkbox'; hangPCb.checked = !!hangP;
  hangPCb.addEventListener('change', ev => setChange(id, 'hangingPunctuation', ev.target.checked));
  hangPCell.appendChild(hangPCb); tr.appendChild(hangPCell);

  return tr;
}

// ─── render ───────────────────────────────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  getFilteredStyles().forEach(snap => tbody.appendChild(buildRow(snap)));
  updateToolbar();
  requestResize();
}

function refreshRow(id) {
  const snap = styles.find(s => s.id === id);
  if (!snap) return;
  const existing = document.querySelector('tr[data-id="' + CSS.escape(id) + '"]');
  if (!existing) return;
  const wasChecked = existing.querySelector('input.row-check') && existing.querySelector('input.row-check').checked;
  const newRow = buildRow(snap);
  existing.replaceWith(newRow);
  if (wasChecked) { const cb = newRow.querySelector('input.row-check'); if (cb) cb.checked = true; }
  updateToolbar();
}

// ─── apply ─────────────────────────────────────────────────────────────────────────────────────
document.getElementById('applyBtn').addEventListener('click', sendApply);
document.getElementById('clearBtn').addEventListener('click', () => {
  edits.clear(); applyStatus.clear();
  document.getElementById('errorPanel').style.display = 'none';
  renderTable();
});
document.getElementById('reloadBtn').addEventListener('click', () => {
  parent.postMessage({ pluginMessage: { type: 'load-styles' } }, '*');
});

function sendApply() {
  const pending = styles.filter(s => isDirty(s.id));
  if (!pending.length) return;
  const editList = pending.map(s => {
    const e = edits.get(s.id);
    return { id: s.id, changes: e.changes, varBindings: e.varBindings };
  });
  parent.postMessage({ pluginMessage: { type: 'apply-changes', edits: editList } }, '*');
  document.getElementById('applyBtn').disabled = true;
}

// ─── messages ──────────────────────────────────────────────────────────────────────────────────
window.onmessage = event => {
  const msg = event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === 'styles-loaded') {
    styles = msg.styles;
    fontMap = msg.fonts || {};
    variableList = msg.variables || [];
    variableMap.clear();
    variableList.forEach(v => variableMap.set(v.id, v));
    edits.clear(); applyStatus.clear();
    document.getElementById('errorPanel').style.display = 'none';
    refreshNameGroupList();
    renderTable();
    return;
  }

  if (msg.type === 'apply-results') {
    const failed = [];
    msg.results.forEach(r => {
      applyStatus.set(r.id, { ok: r.ok, error: r.error });
      if (r.ok) {
        const snap = styles.find(s => s.id === r.id);
        const e = edits.get(r.id);
        if (snap && e) {
          Object.assign(snap, e.changes);
          for (const [field, vid] of Object.entries(e.varBindings)) {
            if (vid === null) delete snap.boundVars[field];
            else snap.boundVars[field] = vid;
          }
        }
        edits.delete(r.id);
      } else { failed.push(r); }
    });
    const ep = document.getElementById('errorPanel');
    if (failed.length) {
      ep.style.display = 'block';
      ep.innerHTML = '<strong>Errors (' + failed.length + '):</strong> ' +
        failed.map(r => escHtml(r.name) + ': ' + escHtml(r.error || 'unknown')).join(' &bull; ');
    } else { ep.style.display = 'none'; }
    renderTable();
    return;
  }

  if (msg.type === 'error') {
    const ep = document.getElementById('errorPanel');
    ep.style.display = 'block';
    ep.textContent = 'Error: ' + msg.message;
  }
};

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── auto-resize ────────────────────────────────────────────────────────────────────────
let resizeRaf = null;
function requestResize() {
  if (resizeRaf) cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    const rows = document.querySelectorAll('#tableBody tr');
    const rowH = rows.length ? (rows[0].offsetHeight || 28) : 28;
    const theadH = (document.querySelector('thead') || {offsetHeight:32}).offsetHeight || 32;
    const toolbarH = document.getElementById('toolbar').offsetHeight;
    const bulkBar  = document.getElementById('bulkBar');
    const bulkH    = bulkBar.style.display !== 'none' ? bulkBar.offsetHeight : 0;
    const ep       = document.getElementById('errorPanel');
    const epH      = ep.style.display !== 'none' ? ep.offsetHeight : 0;
    const totalH = Math.min(800, Math.max(300, toolbarH + bulkH + epH + theadH + rows.length * rowH + 8));
    const totalW = Math.max(800, colWidths.reduce((a,b) => a+b, 0) + 20);
    parent.postMessage({ pluginMessage: { type: 'resize', width: totalW, height: totalH } }, '*');
  });
}

// ─── init ─────────────────────────────────────────────────────────────────────────────────────
buildHeader();
parent.postMessage({ pluginMessage: { type: 'load-styles' } }, '*');
</script>
